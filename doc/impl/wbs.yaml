- id: A-12
  title: Cloudflare Access の JWT 検証
  wave: 1
  kind: codex
  depends: *id001
  owns:
  - api/src/middleware/access.ts
  - api/test/access.test.ts
  reads:
  - concept-design/api/openapi.yaml
  - doc/impl/contracts.md
  - concept-design/api/review-ledger.yaml
  - doc/tech-stack.md
  goal: 管理系の認証(T4)。`requireOperator` の本実装。
  scope:
  - '`Cf-Access-Jwt-Assertion` の署名検証(JWKS の取得とキャッシュ、iss・aud・exp の確認)'
  - 検証できたら `c.set('actor', {email})`。できなければ 401 problem+json
  - '`ACCESS_BYPASS=true` のときだけ検証を迂回する(開発・テスト用)。本番の設定で迂回が有効にならないことを README に書く'
  acceptance:
  - 'テスト: 正しい JWT・期限切れ・署名不正・aud 不一致・迂回'
  - テストは、テスト内で作った鍵ペアと偽の JWKS で行う(外部通信なし)
  notes: Cloudflare 側の設定(ポリシー、AUD、チームのドメイン)は人が行う(D-03)。値は環境変数で受ける。
- id: A-13
  title: 'API: レート制限'
  wave: 1
  kind: codex
  depends: *id001
  owns:
  - api/src/middleware/ratelimit.ts
  - api/test/ratelimit.test.ts
  reads:
  - doc/impl/contracts.md
  - doc/tech-stack.md
  goal: 荒らし対策(T5)。`rateLimit` の本実装。
  scope:
  - 'openapi の非機能(API-18・API-21)の値: 来場者の読み取りは同じ通信元から 1 分に 60 回まで、スタンプを押すのは 1 分に 5 個まで、本文は 1 MB まで(超えたら 413 payload_too_large)'
  - 通信元は IP のハッシュ(生の IP は保存・ログしない。API-19)。方式は、追加の Cloudflare 部品を使わない最小のもの(isolate 内のメモリで可。ベストエフォートであることを README に書く)
  - 超えたら 429 too_many_requests と `Retry-After`。`/changes` は対象外
  acceptance:
  - 'テスト: 上限内・超過・窓の経過後の回復・本文 1 MB 超'
  - '`rateLimit({key, limit, windowSec})` のシグネチャを変えない'
  notes: ''
