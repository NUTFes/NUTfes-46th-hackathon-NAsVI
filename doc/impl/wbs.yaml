  - '場所の取得に失敗したとき、画面が失敗を伝え、再試行できる(orchestrator の state.failedKeys・state.error を使う)'
  - '取得が成功して場所が 0 件のときは、空の一覧として出す(読み込み中のままにしない)'
  - '`versionChanged` が true のとき、再読み込みの表示が出る'
  - 設備(情報・トイレ・休憩・ごみ)は、一覧・絞り込み・件数に入らない(D-030。S-01 の applyFilter・countByBuilding が担当なので、結線では確認だけ)
  notes: |-
    レビューで、各画面の PR に次の必須条件を付けている(#147・#149・#154・#155・#157・#160・#166)。S-08 はこれを満たすこと。
    - 「取得完了」の判定: `createSyncOrchestrator().start()` の Promise が解決し、かつ `state.failedKeys` に 'places' が無いこと。`state.syncing` だけで判定しない(再試行中に出入りする)。'places' が失敗したときは、失敗の画面と再試行(`refresh(failedKeys)` 相当)を出す。Place ストアに「読み込み完了」の印は無い。
    - S-02・S-03 は「一覧が 0 件なら未取得」とみなす暫定のガードを持つ。S-08 が取得完了まで画面を出さないので、このガードは「全場所が削除された」場合に自動 clear しないだけの備えになる。
    - 行き先の解除は、W-09(`placeRemoved`)が先に行い、画面(S-03)の `watch` は一覧の取り直しで消えていた場合の備えである。
    - W-09 の再試行の契機は `online` のみ。オンラインのまま API が落ちたときの再試行は無い。再試行の操作(ボタン)は S-08 が持つ。取得中に適用した出来事が差し替えでいったん戻る件は、実機で確かめる(issue #167)。
    - 410 resync と接続の作り直しは W-09 が行う。画面側で重ねて処理しない。
    - `appVersionChanged` のフラグは `web/src/stores/changes.ts` の `versionChanged`。orchestrator には無い。
    - 階が null の企画は 1 階とみなす(S-07、チームで確認中)。
    - 本番構成(同一オリジンか、Access が 302 を返す構成か)は issue #165 で決定待ち。401 の見せ方は O-01 の admin 側にあり、来場者の画面では扱わない。
    - 位置・方位・カメラ画像を外へ送らない。
    - チームで決める事項の一覧は issue #167。
