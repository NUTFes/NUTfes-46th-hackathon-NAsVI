- id: A-02
  title: 'API: POST /places'
  wave: 1
  kind: codex
  depends: *id001
  owns:
  - api/src/routes/places/create.ts
  - api/test/places.create.test.ts
  reads:
  - doc/d1-schema.md
  - concept-design/api/review-ledger.yaml
  - concept-design/api/openapi.yaml
  - doc/impl/contracts.md
  goal: 場所を登録する(運営のみ)。
  scope:
  - PlaceInput の検証(name 1〜50、floor は landmarkId が null のとき null、存在しない landmarkId は 400。field を返す)
  - ID は UUID v4、`search_text` は normalize で作る、hours を place_hours に保存
  - 本体の更新と changes(placeAdded)を `commitWithChange` で 1 回の batch にする。運営の認可は requireOperator
  acceptance:
  - 201 と Place を返し、changes に placeAdded が 1 行増え、Hub に publish される
  - 不正な入力は 400 invalid_input(field つき)
  - 運営でない呼び出しは 401
  - 'テスト: 正常・各検証エラー・認可'
  notes: ''
