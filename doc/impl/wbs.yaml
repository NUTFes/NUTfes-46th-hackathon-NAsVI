tasks:
- id: F-2
  title: API の基盤(骨組み・共通関数・操作ごとの空のファイル)
  wave: 0
  kind: codex
  depends: []
  owns:
  - api/src/**
  - api/test/helpers.ts
  - api/wrangler.jsonc
  - api/package.json
  - pnpm-lock.yaml
  reads:
  - doc/impl/architecture.md
  - doc/impl/contracts.md
  - concept-design/api/openapi.yaml
  - doc/d1-schema.md
  goal: 並列の実装が衝突しない API の骨組みを作る。雛形の `api/src/index.ts`(Hub と /dev/emit を含む 1 ファイル)を、architecture.md の構成に分ける。
  scope:
  - '`api/src/` を architecture.md の構成に分割する(app.ts、env.ts、config.ts、lib/*、middleware/*、hub/Hub.ts、osm/index.ts)。Hub の動作は変えず、既存のテスト 5 件を通す'
  - 'contracts.md の共通関数を実装する: errors(problem+json)、ids、time、db、normalize、changes(`commitWithChange`)、Hub への publish'
  - wbs.yaml の A-* の `owns` に書かれた操作ごとのファイルを、すべて作る。中身は 501 を返す空の実装(`register(app)` を export)。各ディレクトリの index.ts がそれらを読み込み、app.ts が全部を載せる
  - '`requireOperator`(ACCESS_BYPASS=true なら通す、それ以外は 401)と `rateLimit`(何もしない)の空の実装を置く'
  - テストの共通部品 `api/test/helpers.ts`(マイグレーションを当てた環境、リクエストの送り方、運営の認証の迂回)
  - 依存パッケージを、全タスクが必要とする分(zod、@hono/zod-validator など)すべて先に入れ、pnpm-lock.yaml を確定する。`@cloudflare/vitest-pool-workers` を、改名後の `@cloudflare/vitest-plugin` に移行する
  acceptance:
  - '`corepack pnpm -r typecheck` と `corepack pnpm --filter api test` が通る'
  - 雛形の Hub の 5 テストが、分割後も通る
  - wbs.yaml の A-*・H-* の担当ファイルが、すべて存在する(501 の空の実装)
  - 新しいタスクが app.ts・package.json・pnpm-lock.yaml・マイグレーションを編集せずに済む
  notes: このタスクだけが、共有ファイルの作成を許される。
- id: F-3
  title: フロントの基盤(骨組み・型・ルーター・層の空のファイル)
  wave: 0
  kind: codex
  depends: []
  owns:
  - web/src/**
  - web/package.json
  - web/vite.config.ts
  - pnpm-lock.yaml
  reads:
  - doc/impl/architecture.md
  - doc/impl/contracts.md
  - concept-design/api/openapi.yaml
  - concept-design/screens.yaml
  - doc/device-side-processing.md
  goal: 並列の実装が衝突しない Web の骨組みを作る。
  scope:
  - architecture.md のディレクトリ構成を作る(api/、storage/、sync/、stores/、domain/、services/、map/、ar/、views/、admin/、components/)
  - ルーターに、screens.yaml の全画面と運営の画面の経路を登録する。各 View は「未実装」と出すだけの空のコンポーネント(担当タスクがそのファイルだけを置き換える)
  - 共有の型 `web/src/types.ts`(生成した型から Place・Stamp・Landmark・Label などを再 export)
  - '`web/src/map/layers/types.ts`(Layer のインターフェース)と `layers/index.ts`(各層の空の実装を読み込む)、`web/src/map/core/types.ts`(View と project の型)'
  - '`web/src/domain/geo.ts` に toXY・fromXY・ORIGIN だけを実装する(PR #4 の値。contracts.md)'
  - 依存パッケージを先に入れる(pinia、vue-router、idb、fake-indexeddb、vitest、@vue/test-utils、happy-dom など)。`pnpm gen`(openapi から型を生成)のスクリプトを作る
  acceptance:
  - '`corepack pnpm -r typecheck` と `corepack pnpm --filter web build` が通る'
  - '`corepack pnpm --filter web test` が(空でも)実行できる'
  - すべての経路に空の View があり、開くと「未実装」と出る
  - 新しいタスクが router・package.json・pnpm-lock.yaml を編集せずに済む
  notes: このタスクだけが、共有ファイルの作成を許される。
