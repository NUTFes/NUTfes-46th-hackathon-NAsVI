# 機能ごとの目的と評価基準。ジャーニーを書く前に埋め、ジャーニーの雛形に取り込まれる。
# status: proposed は作成者の提案で、チームの合意前。confirmed にしてから使う。
# 測れる形で書く(「使いやすい」ではなく「3 操作以内」「初見で迷わない」を観察で確かめる形)。
judging:
  status: unknown   # OQ-6。審査基準が分かったら、下の demo_scene と優先度を見直す
  criteria: []

features:
  F1:
    purpose: 来場者が、目当ての場所を、迷わず見つけられる
    status: proposed
    success:
      - 初めて使う人が、企画名の一部を入れてから、その場所の情報を見るまでを、説明なしで終えられる
      - "検索の入力から結果の表示までが、体感で待たされない(目安: 1 秒以内)"
    failure_handling:
      - 一致する場所が無いとき、何も出ないのではなく、一致が無いことと次の手(別の言葉、一覧から探す)が分かる
    demo_scene: 審査員が企画名の一部を入れて、場所の情報が出るところ
    non_goals: [読み仮名での検索]
    extension_note: 最低要件は、店舗名の部分一致検索のみ。Laya(自然言語の曖昧検索)とタグ検索は拡張で、できたら入れる(OQ-8)

  F2:
    purpose: 来場者が、いまの場所から行き先に、迷わず向かえる
    status: proposed
    success:
      - 行き先を決めてから、現在地との位置関係が分かるまで、追加の操作が要らない
      - 現在地が取れているか、古いかが利用者に分かる
    failure_handling:
      - 位置の利用を拒否された、または取れないとき、何ができなくなり、代わりに何ができるかが分かる(OQ-2)
    demo_scene: 会場の外か中で、行き先を選び、現在地から行き先への方向と距離が出るところ
    non_goals: [道なりの経路案内, 屋内の位置検知]

  F3:
    purpose: 来場者が、混んでいる場所や良い場所を、他の来場者のスタンプで知って、行く先や時間を選べる
    status: proposed
    success:
      - 来場者が、地点ごとのスタンプの種類と、それがいつ押されたかを一目で見分けられる
      - "スタンプを押すまでの操作が少ない(目安: 2 操作以内。現在地が取れている場合)"
    failure_handling:
      - 現在地が取れないとき、スタンプを押せないことと、次の手(位置の許可、手での指定)が分かる(OQ-2)
      - 古い混雑スタンプを、新しい情報として見せない(OQ-4)
    demo_scene: 来場者が足元にスタンプを押すと、別の来場者の見える表示に、その地点のスタンプが出るところ
    non_goals: [混雑の自動計測, 混雑の予測]

  F4:
    purpose: 行き先が決まっていない来場者が、種類から選べる
    status: proposed
    success:
      - 種類を選んでから、その種類の場所の一覧が出るまで、1 操作で済む
      - 「お気に入り」を付けた場所だけに絞ると、見える場所がお気に入りだけになり、いま絞り込み中であることが分かる
    failure_handling:
      - その種類に場所が無いとき、空であることが分かる
    demo_scene: 「飲食」を選ぶと、飲食の場所だけが出るところ
    non_goals: [複数の種類の掛け合わせ]
    optional_note: F4 は optional。時間が足りなければ最初に外す(OQ-3)

  F5:
    purpose: 来場者が、いま見ている建物がどれかを知って、迷いから抜け出せる
    status: proposed
    success:
      - 建物を映してから、その建物の名前が出るまでが、体感で待たされない(目安: 2 秒以内)
      - その棟に企画が無いとき、無いことが分かる
    failure_handling:
      - 建物が認識できないとき、認識できなかったことと、次の手(角度や距離を変える、一覧から探す)が分かる
    demo_scene: 来場者が建物を映すと、建物の名前と、その棟の企画(または「企画なし」)が出るところ
    non_goals: [建物内部の透視, 屋内の位置検知]
    optional_note: F5 は Slack の構想から起こした。P1 に入れるかは未確認(input.yaml の F5)
