# 写像 g の出力(定義 6.5)。概念の仕様 + 同期 + 対応表。
# 規則: 概念の仕様(purpose / principle / state / actions)に、他の概念の名前・UI の語・技術の名前を書かない。
#       概念どうしのつながりは、すべて syncs に書く。notes は検査の対象外。
# 「OQ-n」は open-questions.yaml の未決事項への参照。
# 2026-11-19: Notion「NAsVI の概念設計」の最新版(r1〜r4)を反映した。前の案からの変更は decisions.yaml の D-005〜D-011 と、
#             doc/concept-design.md の 7 章を参照。
status: draft   # 案 A のみ。分割・統合の別案は decisions.yaml に論点として残す

concepts:
  - name: Place
    params: [Building]
    purpose: 運営が登録した場所(企画、駐車場、設備)を、来場者がどんな場所があるかとして知れる
    principle: >-
      運営が場所の名前・種別・位置・説明(建物の中なら、建物と階)を登録すると、来場者は登録された場所の一覧を見られ、
      1 つを選ぶと、その名前・位置・説明が分かる。運営が場所を取り除くと、一覧から消える。
      場所の id は開催期間中は変わらず、取り除いた場所の id は、あとで別の場所に使われない。
    state: |
      places: set Place
      name: Place -> one String
      kind: Place -> one Kind          // Kind = {企画, 駐車場, 案内所, トイレ, 休憩所, ゴミ箱}(案内所〜ゴミ箱は設備。OQ-3)
      location: Place -> one Point
      description: Place -> one String
      building: Place -> lone Building // 場所がある建物。屋外の企画・駐車場には無い
      floor: Place -> lone Number      // 階(1 = 1 階、地下は負)。建物の外には無い
      hours: Place -> set Period       // 開催時間。Period = {開始: Time, 終了: Time}。企画は複数の時間帯を持てる(D-020)
    actions:
      - name: register
        requires: なし
        effects: 新しい Place を作り、name・kind・location・description(と、あれば building・floor・hours)を設定して返す
      - name: update
        requires: place が places に含まれる
        effects: 指定された属性(kind を除く)を更新する。kind は登録後に変えない(D-031)
      - name: remove
        requires: place が places に含まれる
        effects: place を places から取り除く
    notes: >-
      一覧と個々の情報を見るのは状態の読み取りで、同期の where が行う(getter は持たない)。
      API は kind を英語のコードで表す(API-36)。概念の kind は日本語のままで、API のコードと 1 対 1 に対応する(対応表は API 側)。
      kind は場所の性質の違い(企画・駐車場・設備)で、Labeling の種類(飲食、展示)とは別(OQ-3)。設備は検索・絞り込みの対象にしない(端末側の規則)。
      building・floor は、外から使う仕様と画面の設計が一致して前提にした項目(decisions D-017)。Building は Landmark の id を指す型で、同期が結ぶ。
      開催期間(工大祭の 2 日間)中は id を変えず、取り除いた id を再び使わない(端末のタグが id で場所を覚えるため)。
      開催時間は、文字列でなく開始と終了の時刻の組で持つ。将来「いまやっている企画」で絞れるようにするため(D-020)。Point・Period と列挙(Kind)は基本の型として扱う(推論)。

  - name: Search
    params: [Item]
    purpose: 来場者が、名前の一部から目当ての項目を見つける
    principle: >-
      項目と、その検索用の文字列を登録する。来場者がキーワードで探すと、文字列にキーワードを含む項目が見つかり、
      含まない項目は見つからない。登録を外した項目は、見つからなくなる。
    state: |
      indexed: set Item
      text: Item -> one String
    actions:
      - name: index
        requires: なし
        effects: item を indexed に加え、検索用文字列を text に設定する(既にあれば置き換える)
      - name: unindex
        requires: item が indexed に含まれる
        effects: item を indexed と text から取り除く
    notes: >-
      「文字列にキーワードを含む項目」を求める計算は、同期の where が行う。
      最低要件は、店舗名の部分一致検索のみ。検索に使う文字列(名前だけか、説明やタグも含むか)は、index に渡す値で決まる。
      Laya(自然言語から曖昧検索できる小規模言語モデル)は拡張で、外部の計算として同期の where から呼ぶ。概念は変えない(OQ-8)。

  - name: Labeling
    params: [User, Item]
    purpose: 来場者が、項目を種類や自分用のタグで絞って選べる
    principle: >-
      運営が種類「飲食」を定めて項目に付ける。来場者が種類「飲食」で絞ると、その種類が付いた項目だけが見える。
      来場者は、自分用のタグ「お気に入り」「行きたい」を作って項目に付けられ、そのタグで絞ると、自分が付けた項目だけが見える。
      他の来場者のタグは見えない。タグを外すか、絞り込みを解除すると、元の見え方に戻る。
    state: |
      labels: set Label
      title: Label -> one String
      owner: Label -> lone User         // 自分用タグの持ち主。無ければ、運営の種類
      labeled: Item -> set Label
      filtering: User -> set Label      // 絞り込みステータス(来場者ごとの、いまの絞り込み)
    actions:
      - name: define
        requires: なし
        effects: 新しい Label を作り、title を設定して labels に加えて返す(owner は無い)
      - name: defineFor
        requires: なし
        effects: 新しい Label を作り、title と owner(u)を設定して labels に加えて返す
      - name: undefine
        requires: label が labels に含まれ、どの item にも label が付いていない
        effects: label を labels から取り除く
      - name: attach
        requires: label が labels に含まれ、label に owner が無いか、owner が u である
        effects: item に label を付ける
      - name: detach
        requires: item に label が付いていて、label に owner が無いか、owner が u である
        effects: item から label を外す
      - name: release
        requires: なし
        effects: item に付いている label をすべて外す
      - name: applyFilter
        requires: label が labels に含まれ、label に owner が無いか、owner が u である
        effects: u の filtering に label を加える
      - name: clearFilter
        requires: なし
        effects: u の filtering を空にする
    notes: >-
      F4(optional)用。F4 を外せばこの概念ごと要らなくなる(decisions D-001)。
      来場者の自分用タグと絞り込みステータスは、目的が同じ(項目をタグで絞って選ぶ)ので、この概念に含めた(decisions D-007)。
      絞り込みに合う場所だけを返す計算は、端末が行う(API-8)。サーバーは各場所に運営の種類を付けて返す。自分用タグ・絞り込みステータスも端末に置く(D-014)。undefine した Label が filtering に残る場合の扱いは未確認。

  - name: Position
    params: [User]
    purpose: 来場者が、自分がいま会場のどこにいるかを知る
    principle: >-
      来場者が位置の利用を許可すると、端末の報告に合わせて、自分の現在地だけが見える。他の来場者の現在地は見えない。
      現在地には報告の時刻と精度が付く。新しい報告は前の現在地を置き換える。消すと、現在地は見えなくなる。
    state: |
      allowed: set User
      refused: set User
      at: User -> lone Point
      accuracy: User -> lone Number
      takenAt: User -> lone Time
    actions:
      - name: allow
        requires: u が refused に含まれない
        effects: u を allowed に加える
      - name: refuse
        requires: なし
        effects: u を refused に加え、allowed から取り除く
      - name: update
        requires: u が allowed に含まれる
        effects: u の at・accuracy・takenAt を、与えられた位置・精度・時刻に更新する
      - name: setManually
        requires: なし
        effects: u の at を与えられた位置にし、accuracy を空にする(OQ-2)
      - name: clear
        requires: なし
        effects: u の at・accuracy・takenAt を空にする
    notes: >-
      端末に位置を求める出来事は、状態を変えない概念の外の出来事なので、アクションにしない。許可と拒否の結果が allow と refuse になる。
      端末が位置を報告する出来事は、外からの要求のアクションとして、同期が update につなぐ。

  - name: Destination
    params: [User, Item]
    purpose: 来場者が、向かう先を 1 つ決めて、そこへの道案内を受けられる
    principle: >-
      来場者が項目を 1 つ選ぶと、それが行き先として保たれる。現在地が変わるたびに、行き先への方角と距離が更新され、
      来場者はそれを見て向かえる。選び直すか解除するまで行き先は変わらず、解除すると道案内も無くなる。
    state: |
      chosen: User -> lone Item
      heading: User -> lone Number     // 行き先への方角
      remaining: User -> lone Number   // 行き先までの距離
      guidedAt: User -> lone Time      // 道案内を更新した時刻
    actions:
      - name: choose
        requires: なし
        effects: u の chosen を item にする(既にあれば置き換える)。道案内(heading・remaining・guidedAt)は空になる
      - name: updateGuide
        requires: u に chosen がある
        effects: u の heading・remaining・guidedAt を、与えられた方角・距離・時刻に更新する
      - name: clear
        requires: u に chosen がある
        effects: u の chosen・heading・remaining・guidedAt を空にする
    notes: >-
      道案内を含めた(decisions D-005)。方角と距離の計算は状態を必要としないので、同期が行い、結果をこの概念が保つ。
      現在地を概念の中で参照しない(独立性)ので、現在地は同期が渡す。道なりの経路は扱わない(decisions D-003)。

  - name: Stamp
    params: []
    purpose: 来場者が、足元にスタンプを押して、混雑や場所の良さを共有し、他の来場者が見て場所を選べる
    principle: >-
      来場者が自分のいる地点にスタンプ(混雑 1〜5、面白い、美味しい、よさ など)を押すと、そのスタンプが地点と時刻つきで残る。
      他の来場者が見ると、その地点にスタンプが見える。押した端末だけが持つ取り消しの証を使って取り消すと、スタンプは見えなくなる。他の人には、誰が押したかは分からない。
    state: |
      stamps: set Stamp
      kind: Stamp -> one StampKind    // StampKind = {混雑1, 混雑2, 混雑3, 混雑4, 混雑5, 面白い, 美味しい, よさ}(OQ-4)
      at: Stamp -> one Point
      proof: Stamp -> one Proof       // 取り消しの証。押した端末だけが持つ。誰が押したかは持たない(D-021)
      pressedAt: Stamp -> one Time
    actions:
      - name: press
        requires: なし
        effects: 新しい Stamp を作り、kind・at・pressedAt と、新しい proof を設定して stamps に加え、Stamp と proof を返す
      - name: retract
        requires: stamp が stamps に含まれ、stamp の proof が与えられた proof と一致する
        effects: stamp を stamps から取り除く
    notes: >-
      API は StampKind を英語のコードで表す(API-36)。概念の値は日本語のままで、API のコードと 1 対 1 に対応する。
      旧 Congestion を完全に差し替えた(decisions D-006)。混雑は、スタンプの種類(混雑 1〜5)の 1 つとして扱う。
      スタンプは場所(Place)ではなく、押した人の現在地(Point)に付く(decisions D-009)。そのため Place の削除には連動しない。
      押した人を持たない(取り消しは proof の一致で確かめる。端末のデータが消えると取り消せないことは受け入れる)。基本の型として Proof を扱う(推論)。
      古い混雑スタンプを答えに出さない判定は、同期 show-stamps の where が行う(時間の経過で起きるアクションを書く方法が未確認のため)。

  - name: Landmark
    params: []
    purpose: 来場者が、いま見ている建物がどれかを知って、迷いを解く
    principle: >-
      建物の名前・位置・輪郭が登録される。来場者が端末を建物に向けると、現在地と向きから、正面にある建物の名前と位置が分かる。
      正面に建物が無ければ、分からない。建物が取り除かれると、その建物は分からなくなる。
    state: |
      landmarks: set Landmark
      name: Landmark -> one String
      location: Landmark -> one Point
      footprint: Landmark -> lone Polygon  // 建物の輪郭(地図上の多角形の頂点列)。地図データに無い建物は持たない(D-023)
    actions:
      - name: register
        requires: なし
        effects: 新しい Landmark を作り、name・location を設定し、footprint が与えられていれば設定して、landmarks に加えて返す
      - name: update
        requires: landmark が landmarks に含まれる
        effects: 指定された属性を更新する
      - name: remove
        requires: landmark が landmarks に含まれる
        effects: landmark を landmarks から取り除く
    notes: >-
      正面の建物を決める計算(現在地から向いている方向へ線を伸ばし、最初に輪郭と交わる建物を選ぶ)は、状態を必要としない計算なので、概念にせず、外部の計算(Geometry.facing)として同期の where に置く(推論)。
      映像は使わない。現在地と向きは端末の中で計算し、サーバーへ送らない(decisions D-018)。
      輪郭は地図データ(OpenStreetMap)から取り、運営は描かない・直さない。取り直す操作だけを持つ(同期 reload-footprint。D-019)。配り方は OQ-16。
      基本の型として Polygon を扱う(推論)。Place と重なる疑い(どちらも位置を持つ)は、輪郭を持つので分けた(decisions D-008)。

syncs:
  # ---- 場所(F1) ----
  - name: register-place
    when: Request.registerPlace
    where: 実行者が場所を管理できる   # OQ-1。運営者用のイベント登録ページからの要求(OQ-5 で確定)
    then: Place.register

  - name: update-place
    when: Request.updatePlace
    where: 実行者が場所を管理できる   # OQ-1
    then: Place.update

  - name: remove-place
    when: Request.removePlace
    where: 実行者が場所を管理できる   # OQ-1
    then: Place.remove

  - name: show-places
    when: Request.showPlaces
    where: >-
      p が Place.places に含まれ、Place の name・kind・location・description・building・floor・hours と、p に付いた運営の種類(labelIds)を返す。
      絞り込みは端末でまとめて行う(API-8、D-012・D-014)。運営の種類どうしは OR、自分用のタグは AND(D-016)。設備は絞り込まない
    then: Request.respond(場所の一覧。各場所に運営の種類を付ける)

  - name: search-places
    when: Request.search
    where: p が Search.indexed に含まれ、Search.text of p が keyword を含む   # 絞り込みも検索結果に効かせる(D-012)。絞り込みは端末で行う(API-8)
    then: Request.respond(一致した場所の名前・位置・運営の種類。一致が無ければ空)

  - name: search-places-laya
    when: Request.searchNatural
    where: p が Search.indexed に含まれ、Laya.matches(sentence, Search.text of p)   # 外部の計算(推論)。OQ-8
    then: Request.respond(一致した場所の名前と位置)

  # ---- 場所の変化に、他の概念を連動させる ----
  - name: index-on-register
    when: Place.register
    where: Place.kind of p が設備(案内所・トイレ・休憩所・ゴミ箱)でない   # 設備は検索に出さない。地図の「表示する印」で探す(D-027)
    then: Search.index

  - name: reindex-on-update
    when: Place.update
    where: name が更新され、Place.kind of p が設備でない   # D-027
    then: Search.index

  - name: remove-unindexes
    when: Place.remove
    where: ""
    then: Search.unindex

  - name: remove-releases-labels
    when: Place.remove
    where: ""
    then: Labeling.release

  - name: remove-clears-destination
    when: Place.remove
    where: Destination.chosen が、取り除かれた place である
    then: Destination.clear

  # ---- 種類と自分用タグ・絞り込み(F4) ----
  - name: define-label
    when: Request.defineLabel
    where: 実行者が場所を管理できる   # OQ-1
    then: Labeling.define

  - name: show-labels
    when: Request.showLabels
    where: l が Labeling.labels に含まれ、Labeling.owner of l が無い(運営の種類)   # API-6。種類のチップの名前に使う
    then: Request.respond(運営の種類の一覧)

  - name: remove-label
    when: Request.removeLabel
    where: 実行者が場所を管理できる   # OQ-1。Labeling.undefine の事前条件(どの場所にも付いていない)を満たさなければ断る(API-10)
    then: Labeling.undefine

  - name: assign-label
    when: Request.assignLabel
    where: place が Place.places に含まれ、実行者が場所を管理できる   # OQ-1
    then: Labeling.attach

  - name: unassign-label
    when: Request.unassignLabel
    where: place が Place.places に含まれ、実行者が場所を管理できる   # OQ-1。付け間違いの取り消し。種類そのものは消えない(D-028。API-41)
    then: Labeling.detach   # 付いていなければ事前条件を満たさない。API は、付いていなくても成功として返す(API-41)

  - name: define-my-tag
    when: Request.defineMyTag
    where: ""
    then: Labeling.defineFor

  - name: mark-place
    when: Request.markPlace
    where: place が Place.places に含まれる
    then: Labeling.attach

  - name: unmark-place
    when: Request.unmarkPlace
    where: ""
    then: Labeling.detach

  - name: apply-filter
    when: Request.applyFilter
    where: ""
    then: Labeling.applyFilter

  - name: clear-filter
    when: Request.clearFilter
    where: ""
    then: Labeling.clearFilter

  - name: browse-by-label
    when: Request.browse
    where: p が、label の付いた項目(Labeling.labeled)である
    then: Request.respond(その種類の場所の名前と位置)

  # ---- 現在地・行き先(F2) ----
  - name: allow-location
    when: Request.allowLocation
    where: ""
    then: Position.allow

  - name: refuse-location
    when: Request.refuseLocation
    where: ""
    then: Position.refuse

  - name: report-position
    when: Request.reportPosition
    where: ""
    then: Position.update

  - name: set-position
    when: Request.setPosition
    where: ""   # OQ-2
    then: Position.setManually

  - name: choose-destination
    when: Request.chooseDestination
    where: place が Place.places に含まれる
    then: Destination.choose

  - name: clear-destination
    when: Request.clearDestination
    where: u に Destination.chosen がある   # 着く前の「案内をやめる」も、着いた後の「案内を終える」も、同じ操作(D-026)
    then: Destination.clear

  - name: guide-on-choose
    when: Destination.choose
    where: Position.at of u が a で、Place.location of 行き先 が b である
    then: Destination.updateGuide   # direction(a, b)、distance(a, b)、Position.takenAt of u を渡す

  - name: guide-on-move
    when: Position.update
    where: Destination.chosen of u が d で、Place.location of d が b である
    then: Destination.updateGuide   # direction(a, b)、distance(a, b) を渡す

  - name: show-route
    when: Request.showRoute
    where: Destination.chosen of u が d で、Destination.heading・remaining・guidedAt of u がある
    then: Request.respond(行き先の名前、方角、距離、更新時刻)

  # ---- スタンプ(F3) ----
  - name: press-stamp
    when: Request.pressStamp
    where: Position.at of u が p である   # 足元 = 押す人の現在地
    then: Stamp.press

  - name: retract-stamp
    when: Request.retractStamp
    where: ""   # Stamp.retract の事前条件(stamp が stamps に含まれ、proof が一致すること。D-021)が確かめる。一致しなければ取り消されない
    then: Stamp.retract

  - name: show-stamps
    when: Request.showStamps
    where: >-
      s が Stamp.stamps に含まれ、混雑スタンプなら(now - Stamp.pressedAt of s)が 30 分以内、感想のスタンプ(面白い・美味しい・よさ)ならその日の閉場まで   # 仮置きの値(D-022)。OQ-4
    then: Request.respond(スタンプの種類、地点、押された時刻、消える時刻 expiresAt)   # expiresAt は、混雑なら(押された時刻 + 30 分)、感想ならその日の閉場。API-38

  # ---- 建物の認識と、迷いの解消(F5) ----
  - name: register-landmark
    when: Request.registerLandmark
    where: 実行者が場所を管理できる。輪郭は OpenStreetMap から取る(Osm.outline(建物の位置)。外部の計算。D-019)   # OQ-1
    then: Landmark.register   # 取った輪郭を footprint として渡す。輪郭が取れなければ footprint なしで登録する(D-023、OQ-17)

  - name: update-landmark
    when: Request.updateLandmark
    where: 実行者が場所を管理できる   # OQ-1
    then: Landmark.update

  - name: reload-footprint
    when: Request.reloadFootprint
    where: 実行者が場所を管理できる。l が Landmark.landmarks に含まれ、Osm.outline(Landmark.location of l)が輪郭を返す   # 外部の計算(推論)。運営が輪郭を描かず、取り直すだけ(D-019)。OQ-1
    then: Landmark.update   # 取り直した輪郭を footprint として渡す。輪郭が取れなければ、footprint は変えずに断る

  - name: remove-landmark
    when: Request.removeLandmark
    where: 実行者が場所を管理できる   # OQ-1
    then: Landmark.remove

  - name: recognize-building
    when: Request.recognizeBuilding
    where: l が Landmark.landmarks に含まれ、l が footprint を持ち、Geometry.facing(Position.at of u, 向き, Landmark.footprint of l)   # 外部の計算(推論)。現在地と向きは端末内で扱い、送信しない。D-018
    then: Request.respond(正面の建物の名前と位置)

  - name: show-landmarks
    when: Request.showLandmarks
    where: l が Landmark.landmarks に含まれる
    then: Request.respond(建物の一覧)   # API-6

  - name: show-building-events
    when: Request.showBuildingEvents
    where: 一致した建物 l について、Place.places に含まれ、Place.building of p が l であり、Place.kind of p が設備でない p がある   # 距離でなく、建物との結びつきで決める(D-024。API-23)。設備は建物の企画に含めない(D-030)
    then: Request.respond(建物と、その建物の場所の一覧)   # 各企画の方向・距離・「建物の奥か」は、端末が現在地・向き・輪郭から計算する。概念の外(D-025)

  - name: show-no-events
    when: Request.showBuildingEvents
    where: 一致した建物 l について、Place.places に含まれ、Place.building of p が l であり、Place.kind of p が設備でない p が無い   # D-024、D-030
    then: Request.respond(建物と、「この建物には企画がない」)

# 機能 × 概念・同期の対応表(定義 6.4)。空の行は実現されていない機能、空の列は使われない概念。
trace:
  - feature: F1
    concepts: [Place, Search]
    syncs: [register-place, update-place, remove-place, show-places, search-places, search-places-laya, index-on-register, reindex-on-update, remove-unindexes]
  - feature: F2
    concepts: [Place, Position, Destination]
    syncs: [allow-location, refuse-location, report-position, set-position, choose-destination, clear-destination, guide-on-choose, guide-on-move, show-route, remove-clears-destination]
  - feature: F3
    concepts: [Position, Stamp]
    syncs: [press-stamp, retract-stamp, show-stamps]
  - feature: F4
    concepts: [Place, Labeling]
    syncs: [define-label, show-labels, remove-label, assign-label, unassign-label, define-my-tag, mark-place, unmark-place, apply-filter, clear-filter, browse-by-label, remove-releases-labels]
  - feature: F5
    concepts: [Place, Landmark]
    syncs: [register-landmark, update-landmark, reload-footprint, remove-landmark, show-landmarks, recognize-building, show-building-events, show-no-events]
