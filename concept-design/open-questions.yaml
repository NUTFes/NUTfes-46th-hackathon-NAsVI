questions:
  - id: OQ-1
    question: 場所の登録を行う運営を、どう識別するか(運営者用の登録ページの認証。運営のみか、出展者も含めるか)。スタンプは来場者が押すので、報告者の権限は要らない
    blocks: [concepts.syncs, journey.F1, journey.F5, api.権限]
    owner: チーム
    status: open
    answer: null
    note: 運営の認証は、API 設計(台帳 API-12、2026-11-23)で Cloudflare Access にする方針。出展者のアカウントは今回やらない(api/roadmap.md)。この問いの概念設計での扱いは、チームの決定待ち

  - id: OQ-2
    question: GPS が取れないとき、現在地を手で指定する操作を P1 に入れるか
    blocks: [concepts.Position, journey.F2]
    owner: チーム
    status: open
    answer: null

  - id: OQ-3
    question: 種類(カテゴリ)で選ぶ F4 を P1 に入れるか。Place.kind(企画・駐車場・設備)との線引きはどうするか
    blocks: [concepts.Labeling, input.F4]
    owner: チーム
    status: open
    answer: null
    note: >-
      利用者の意見(API 設計の台帳 API-28、2026-11-22)。設備(案内所・トイレ・休憩所・ゴミ箱)を Place.kind に足す。チームの決定待ち。

  - id: OQ-4
    question: スタンプの種類(混雑 1〜5、面白い、美味しい、よさ など)と、混雑スタンプを古いとみなす時間。感想のスタンプに期限を付けるか
    blocks: [concepts.Stamp, journey.F3]
    owner: チーム
    status: open
    answer: null
    note: >-
      仮置きの値(混雑 30 分、感想は閉場まで)で進めている(D-022)。もとは API 設計の台帳 API-17 の利用者の意見(2026-11-22)。値はチームの決定待ち。

  - id: OQ-5
    question: 場所のデータをどう入れるか(運営が操作して登録するか、スプレッドシートから取り込むか)
    blocks: [concepts.Place, api.登録系]
    owner: チーム
    status: resolved
    answer: 運営者用のイベント登録ページから登録する(2026-11-19、Slack の発言)。スプレッドシートの取り込みは、使う場合だけ。チームの確認待ち

  - id: OQ-6
    question: ハッカソンの審査基準、デモの場面、チーム人数、想定来場者数
    blocks: [criteria, input.passthrough]
    owner: チーム
    status: open
    answer: null
    note: 想定来場者数は、前回が 2 日間で 10000 人程度(利用者、2026-11-22。API 設計の台帳 API-21)。審査基準・デモの場面・チーム人数は未回答。

  - id: OQ-7
    question: input.yaml の課題・機能 F1〜F5 は、ボードの P1 案と合っているか(F1〜F4 は画像から推測した下書き。F3・F4 の広げ方と F5 は Slack の発言から)
    blocks: [input, concepts, journey, api]
    owner: 作成者
    status: open
    answer: null

  - id: OQ-8
    question: タグ検索を入れるか。Laya(自然言語から曖昧検索できる小規模言語モデル)の入出力形式と、動かす場所(端末かサーバか)
    blocks: [concepts.Search, journey.F1]
    owner: チーム
    status: open
    answer: null

  - id: OQ-9
    question: 待ち合わせ(周囲のオンライン者に合言葉を共有する案)を入れるか。入れる場合、位置の共有を許可した相手にだけ見せる形にするか(現在地は自分のみ、という原理と衝突する)
    blocks: [input, concepts.Position]
    owner: チーム
    status: open
    answer: null

  - id: OQ-10
    question: 「迷っている」をどう判定するか(行き先から遠ざかる、同じ所に長く留まる、など)
    blocks: [concepts.syncs, journey.F5]
    owner: チーム
    status: open
    answer: null
    note: 建物の「近く」とみなす範囲(near)は、建物との結びつきで決める形に変えたので要らなくなった(D-024)。残るのは「迷っている」の判定だけ。

  - id: OQ-11
    question: 建物の認識の実装(ブラウザ内で動く小型の視覚モデルか、既存の MindAR か)。映像から判定までを端末内で通し、画像を保存・送信せず結果だけ見せる条件を満たせるか
    blocks: [concepts.Landmark, api]
    owner: チーム
    status: resolved
    answer: 映像は使わず、現在地・向き・建物の輪郭で決める(D-018)。画像認識(MindAR)は拡張として残す

  - id: OQ-12
    question: 来場者(User)を誰が供給するか。識別しない場合、現在地・行き先・自分用タグ・絞り込みは端末内に置く形になる(自分用タグは D-014 で端末内に決まった。残りが未決)。その場合、これらを概念として残すかも決める
    blocks: [concepts.Position, concepts.Destination, concepts.Labeling, concepts.Stamp, api.権限]
    owner: チーム
    status: open
    answer: null
    note: API 設計では、現在地と行き先(Position・Destination)を端末内に置き、API に載せない形で進める(api/review-ledger.yaml の API-5、2026-11-22)。来場者を識別するかは未決のまま。

  - id: OQ-13
    question: 自作タグの名前のルール(空欄・重複・文字数)と、タグの上限数。名前の変更・削除ができるか、固定の 2 つを消せるか
    blocks: [concepts.Labeling, screens.タグを作る画面]
    owner: チーム
    status: open
    answer: null
    note: 決める時期は、タグを作る画面を設計するとき。画面設計のいまの段階では決めない(2026-11-21)。

  - id: OQ-14
    question: 階ごとの見取り図(階の画像と、四隅の緯度経度)を、新しい概念にするか。Place・Landmark とは目的が違う(API-29・30、wireframe の ※)
    blocks: [concepts, api.landmarks, screens.building]
    owner: チーム
    status: resolved
    answer: 概念にしない。建物の付属データとして、API と画面で扱う(D-029)

  - id: OQ-15
    question: 建物の輪郭の出どころと配り方。OpenStreetMap を正にして固定するか、運営が建物の輪郭を登録・修正できるようにするか。端末へは静的ファイルで同梱するか、サーバーから返すか
    blocks: [concepts.Landmark, api.landmarks, screens.op_landmarks]
    owner: チーム
    status: resolved
    answer: OSM を正にする。運営は取り込みと読み込み直しだけ(D-019)
    note: PR #4 の試作は 99 棟・約 26KB の静的ファイル。場所と建物は、名前でなく建物の id の参照で結ぶ(Place.building)。

  - id: OQ-16
    question: 建物の輪郭を、端末へ静的ファイルで同梱するか、サーバー(API)から返すか
    blocks: [api.landmarks]
    owner: チーム
    status: open
    answer: null
    note: PR #4 の試作は 99 棟・約 26KB の静的ファイル。読み込み直し(reload-footprint)の結果をどう端末へ届けるかに関わる。

  - id: OQ-17
    question: 輪郭の無い建物(D-023)を、運営にどう知らせるか。カメラの正面に出ない建物があることを、受け入れてよいか
    blocks: [concepts.syncs, api.landmarks]
    owner: チーム
    status: open
    answer: null
    note: 概念は D-023 で、輪郭の無い建物を認めた。API-37(footprint の null)は合意待ち。運営が輪郭を直さない方針(D-019)なので、取れない建物は登録の画面で気づける必要がある。

  - id: OQ-18
    question: 行き先に「着いた」とみなす距離(ワイヤーフレームの仮置きは 20 m)と、現在地が「古い」とみなす時間(30 秒、仮置き)
    blocks: [journey.F2, design-system.DestinationCard]
    owner: チーム
    status: open
    answer: null
    note: どちらも設計の根拠が無い仮置き。端末が計算する値で、概念の状態には入れない(D-026)。デザインシステムの DestinationCard と、画面 V1-n の「着きました」が使っている。

