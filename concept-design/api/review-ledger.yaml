      通信元(IP アドレス)は連打の制限(API-18)に要る間だけメモリーに置き、ログには地点も通信元も残さない(案 A)。
      スタンプの地点と押した時刻(pressedAt)は公開する。人が少ない時間帯に「その時刻にそこにいた人」が推測できる点も含めて、公開でよい(ゲート 3 の回答)
