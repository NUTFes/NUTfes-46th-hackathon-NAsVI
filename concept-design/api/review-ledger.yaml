  - id: API-12
    kind: 認証・認可
    content: >-
      運営の操作(場所・種類・建物の登録・更新・削除)の認証方式と、誰が呼べるか(運営のみか、出展者も含めるか)。
      回答: 運営だけが呼べる(案 A)。共通の運営用パスワードでログインし、受け取った token を Authorization: Bearer で付けて呼ぶ。来場者の操作は認証なし。
      出展者のアカウント(案 B)は今回やらない。展望として api/roadmap.md に残した
      回答(2026-11-23、利用者): 運営の認証は Cloudflare Access にする。共通パスワードと、ログインで token を受け取る操作は、この API に持たない。
      Access を通ったリクエストの Cf-Access-Jwt-Assertion ヘッダーをサーバーが検証する(openapi.yaml の operatorAuth)。
      運営の画面・操作の入口を Access で守る設定はインフラ側の作業。API の範囲外。画面設計・概念設計には影響しない(ログイン画面は無い)
    state: 確定
    placeholder: ""
    decided_by: sabo10p
    date: "2026-11-22"
