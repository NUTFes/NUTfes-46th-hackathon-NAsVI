  - id: API-14
    kind: バリデーション
    content: >-
      場所・種類・建物の項目の必須と文字数、検索語の上限、位置の形。
      回答(項目): 場所に建物(landmarkId)と階(floor)を足す(案 C)。時間は説明(description)に書く → main の D-020 で、開催時間は Place.hours(開始と終了の組、複数可)として持つことに変わった。仕様に hours を足した(2026-11-23)。
      建物の中の地図(building)で、建物と階ごとに企画を出すため。屋外の企画・駐車場は、どちらも null。
      概念設計の変更が要る(Place に建物と階を持たせる。建物との結びつきを、概念の仕様に書くか同期に書くかはチームが決める)。
      回答(細かい決まり、案 A): 場所の名前 1〜50 文字(重複は許す。実際には名前が違うはず、と利用者)、説明 500 文字以下、
      種類の名前 1〜20 文字で重複を禁止(409 label_title_taken)、階は整数 -5〜20、位置は緯度経度(lat・lng)、検索語は 1〜50 文字。違反は 400
      利用者の意見: 場所に建物と階を持たせる(概念設計の変更)。概念設計に入れるかはチームが決める(ゲート 2 の質問 6 の回答 C)。
    state: 仮置き
    placeholder: "場所に建物(landmarkId)と階(floor)を足すのは、利用者が API 設計の範囲として決めた(2026-11-23)。階は landmarkId が null のとき null(openapi.yaml に書いた)。文字数などの決まりは、仮置きの値のまま合意とする。実装して合わなければ直す(2026-11-23、利用者)"
