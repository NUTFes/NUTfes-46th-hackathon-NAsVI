      応答の上限時間は 10 秒。本文は 1 MB まで(超えたら 413。画像を送る操作は D-018・API-29 の変更で無くなった)。リアルタイムの接続には 30 秒ごとに空の合図(コメント行)を送る。
      スタンプの連打の制限は API-18(1 分に 5 個)。
      来場者数: 前回は 2 日間で 10000 人程度(利用者、2026-11-22)。1 日 5000 人。
      同時に使う人数の推定(AI の推論。確かめていない): 来場者の 3 割が使い、最も混む 1 時間に 1 日の 2 割が集まるとすると、1 時間に約 300 人。
      リアルタイムの接続が同時に数百本なら、1 台のサーバーで足りる見込み。値は、使う割合が分かったら見直す
    state: 確定
    placeholder: ""
