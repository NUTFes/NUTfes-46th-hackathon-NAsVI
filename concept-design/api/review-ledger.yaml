  - id: API-20
    kind: 互換性
    content: >-
      版(バージョン)を付けるか。破壊的変更の定義。
      回答: 版は付けない(パスに /v1 を入れない)。当日のホットフィックスはあり得るので、当日の変更は壊さない変更だけに限る(案 A')。
      してよい: 応答に項目を足す、新しい API を足す、任意の入力項目を足す、エラーの文言を直す。
      してはいけない(破壊的変更): 項目を消す・名前を変える・型や意味を変える、必須の入力項目を足す、パスを変える。
      どうしても破壊的変更が要るときは、/changes に appVersionChanged を流し、画面に再読み込みを促す(今から入れておく)。
      画面は、知らない項目と知らない出来事を無視する
    state: 確定
