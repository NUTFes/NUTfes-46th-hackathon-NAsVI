  - id: API-18
    kind: 冪等性・競合
    content: >-
      スタンプの連打・押し直しと、場所の同時更新の扱い。
      回答(連打): 同じ通信元(IP アドレス)から押せる数を制限する(案 A。1 分に 5 個まで)。超えたら 429 too_many_requests。
      理由: 在学生以外の来場者は会場の Wi-Fi を使わず、通信元がばらばらになるはず(利用者)。
      残る懸念: 在学生が学内の Wi-Fi から押すと、同じ通信元を共有して上限に当たりやすい。
      回答(同時更新): 運営が 2 人で同じ場所を直したら、あとから送った方の内容が残る(版の照合はしない)
    state: 確定
    placeholder: ""
    decided_by: sabo10p
