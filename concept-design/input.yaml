# 写像 g の入力(定義 5.4 のテンプレート)
# 状態: 下書き。概念設計ボード(画像)の P1 案から起こした。画像は判読できない箇所があるため、
# 推測した箇所には「★要確認」を付けてある。確認できたら ★ を外し、status を confirmed にする。
status: draft
# 2026-11-19: Notion の最新設計を反映。F3 をスタンプへ、F4 を自分用タグへ広げ、F5(迷いを解く)を足した。F5 は Slack の構想から起こした(★要確認)。

problem:
  domain: 大学祭(NUTfes)の会場での来場者の行動   # ★要確認
  # 解決策から独立に書く(I6)。「地図」「アプリ」という語を入れない。
  statement: >-
    来場者は、行きたい企画や駐車場がどこにあるか、そこへどう行くか、いま混んでいるかを、
    会場の中で手早く知る手段を持たない。また、いま自分がどの建物の前にいるかが分からず、迷っても抜け出す手段を持たない。   # ★要確認(Slack の発言から)
  stakeholders:
    - name: visitor
      role: 来場者
      impact: 目当ての場所を探す、向かう、混雑を避ける。会場に初めて来た人を含む   # ★要確認(初来場者中心か)
    - name: organizer
      role: 運営・出展者
      impact: 場所の情報を把握している側。運営者用のイベント登録ページから場所を登録する(OQ-5)。誰が操作できるかは OQ-1   # ★要確認(OQ-1)
  evidence:
    - ボードの課題グループ G1「行き先を探す」G2「移動中の位置と道」G3a「混み具合・営業の状況」   # 投票数は判読できず未転記

# 機能は価値の単位(I1)。UI と技術を含めない(I3, I4)。optional: true は外して比べられる機能(I5)。
features:
  - id: F1
    name: 行きたい場所を見つける
    value: 来場者が、目当ての企画や駐車場を、名前の一部から探し出せる
    stakeholders: [visitor]
    scenario: 来場者が企画名の一部を入力すると、該当する場所の一覧が返り、1 つ選ぶとその場所の情報が分かる
    optional: false

  - id: F2
    name: 行き先へ向かう
    value: 来場者が、自分の現在地と行き先の位置関係をつかんで、迷わず向かえる
    stakeholders: [visitor]
    scenario: 来場者が行き先を 1 つ決めると、自分の現在地から行き先までの方向と距離が分かる
    optional: false

  - id: F3
    name: 混雑・感想を知る
    value: 来場者が、足元に押されたスタンプ(混雑 1〜5、面白い、美味しい、よさ など)から、混んでいる場所や良い場所を知って、行く先や時間を選べる
    stakeholders: [visitor]
    scenario: 来場者が自分のいる地点にスタンプを押すと、他の来場者は、その地点のスタンプと押された時刻を見られる   # スタンプの種類は OQ-4
    optional: false

  - id: F4
    name: 種類・自分用タグから選ぶ
    value: 行き先が決まっていない来場者が、種類(飲食、展示など)や自分用のタグ(お気に入り、行きたい)から場所を選べる。タグで絞ると、見える場所も絞られる
    stakeholders: [visitor]
    scenario: 来場者が種類か自分用のタグを選ぶと、それが付いた場所だけが見える   # 自分用タグと絞り込みステータスは Slack の発言から
    optional: true   # ボードの「カテゴリ」。P1 で入れるか未確認(OQ-3)

  - id: F5
    name: 迷いを解く
    value: 来場者が、いま見ている建物がどれかを知り、その建物に企画が無いことも含めて、迷いから抜け出せる
    stakeholders: [visitor]
    scenario: 来場者が端末を建物に向けると、その建物の名前と位置が分かる。その建物に企画が無ければ、無いことが分かる
    optional: true   # ★要確認(Slack の構想。P1 に入れるか未確認)

# g は使わない。後の写像(技術の選択、型構成)へそのまま渡す。
passthrough:
  scale:
    visitors_total: 数千            # 実人数。見積もりでは仮に 5000 とする(利用者、2026-11-23。OQ-6)
    visitors_gross: 10000         # 前回の延べ人数(2 日間。重複を含む。利用者、2026-11-22。API-21)
    app_usage_rate: 4〜6割          # アプリの利用率の見込み(利用者、2026-11-23)
    concurrent: 約 350(上限 約 630)  # 見積もり。doc/sse-sizing.md。f(画面を開く割合)は仮定
  constraints:
    deadline: 2週間                # ボードの「2週間で作れる範囲」から
    team_size: 5                   # 利用者、2026-11-23(OQ-6)
    judging_criteria: なし          # 審査基準は考慮しない(利用者、2026-11-23。OQ-6)
  tech_preferences:
    # ボードの P1 の記述から推測。確認前の値。
    map: Leaflet または MapLibre   # ★要確認
    data: 運営者用のイベント登録ページ(スプレッドシートの取り込みは任意)   # OQ-5
    search: 店舗名の部分一致が最低要件。Laya(自然言語の曖昧検索)は拡張   # OQ-8
    recognition: ブラウザ内で動く小型の視覚モデル、または MindAR   # ★要確認(OQ-11)
    hosting: Cloudflare Pages など   # ★要確認
