# 設計上の課題の記録(問題 → 選択肢 → 採用案と理由)。写像の分割・統合の判断をここに残す。
# 別案を捨てたときも理由を残す。後の写像から差し戻されたときに、同じ手順でやり直せるようにするため。
decisions:
  - id: D-001
    problem: 種類で選ぶ振る舞い(Labeling)を、独立した概念にするか、Place の属性に畳むか
    options:
      - 独立した概念 Labeling [Item, Label]
      - Place に category 属性を持たせる
    adopted: 独立した概念(案 A)
    reason: >-
      目的が「種類で絞って選べる」で、場所を知る目的(Place)と別。混ぜると混同になる(分離)。
      また F4 が optional なので、独立させておけば F4 を外すときに概念ごと外せる(I5)。
    status: open   # OQ-3 の結果で、F4 ごと外れる可能性がある
    derived_from: 6.1040 L04(分離・特定性)

  - id: D-002
    problem: キーワード検索を、Place の振る舞いに含めるか、独立した概念にするか
    options:
      - 独立した概念 Search [Item]
      - Place.query として Place に含める
    adopted: 独立した概念(案 A)
    reason: >-
      目的が「名前の一部から見つける」で、場所を知る目的と別。含めると Place が過負荷になる。
      Search は Item の型を問わないので、汎用性もある。連動は同期(register-indexes)に出した。
    status: open
    derived_from: 6.1040 L04(特定性・汎用性)

  - id: D-003
    problem: 現在地から行き先への経路(P1 は直線)を、概念にするか
    options:
      - 概念にする(Route)
      - 概念にしない。Position と Destination の値から画面が計算する
    adopted: 概念にしない(案 A)
    reason: >-
      直線は状態を持たない計算で、保つべき状態も、アクションの事前条件も無い。
      道なりの経路など、経路を保つ・選ぶ振る舞いが出てきたら Route を立てる。
    status: open
    derived_from: 6.1040 L02(状態の無いものは概念にならない)。資料内の明示は無く、資料外の判断

  - id: D-004
    problem: 地図表示を概念にするか
    options:
      - 概念にする(Map)
      - 概念にしない
    adopted: 概念にしない
    reason: 地図は表現(UI)で、Place・Position・Congestion の状態を重ねて描く。表現に依存しない(定義 4 章)。
    status: resolved
    derived_from: 定義 4 章「UI に依存しない」

  - id: D-005
    problem: 道案内(行き先への方角と距離)を、概念に含めるか、画面が毎回計算するか
    options:
      - Destination に道案内の状態(heading・remaining・guidedAt)を含める
      - 含めず、画面が現在地と行き先から毎回計算する
    adopted: Destination に含める(案 A)
    reason: >-
      Slack のコメント「道案内までこの概念に含めていいのでは」に従った。目的が「向かう先を決めて、そこへ向かう」で同じ。
      計算は状態を必要としないので同期が行い、結果を Destination が保つ。現在地を Destination の中で参照すると独立性を崩すため、現在地は同期が渡す。
      道なりの経路を扱う場合は、経路の状態を Destination に足すか別の概念にする(D-003 の続き)。
    status: open   # チームの合意前
    derived_from: Notion r1(2026-11-19)

  - id: D-006
    problem: 混雑の報告(Congestion)を、スタンプに差し替えるか
    options:
      - 差し替える。足元に押すスタンプ Stamp(混雑 1〜5、面白い、美味しい、よさ など)にする
      - 混雑の報告を残し、感想のスタンプを別の概念として足す
    adopted: 差し替える(案 A)
    reason: >-
      Slack の発言「足元にスタンプを押す。混雑状況 1〜5、面白い、美味しい、よさ」に従った。混雑も感想も「足元に押して共有する」で目的が同じ。
      報告者の権限(OQ-1)は不要になり、スタンプは来場者が押す。
    status: open   # スタンプの種類と期限は OQ-4
    derived_from: Notion r1(2026-11-19)

  - id: D-007
    problem: 来場者の自分用タグ(お気に入り、行きたい)と絞り込みステータスを、Labeling に含めるか、別の概念にするか
    options:
      - Labeling [User, Item] に含める(owner を持つ Label が自分用タグ)
      - 運営の種類は Labeling、自分用タグは別の概念(Bookmark など)にする
    adopted: Labeling に含める(案 A)
    reason: >-
      目的が同じ(項目をタグで絞って選ぶ)。Slack のコメントも Labeling への追記だった。絞り込みステータス(filtering)も、同じ概念で保つ。
      運営の種類と自分用タグを分ける案は、確認できていない点として doc/concept-design.md の 8 章に残した。
    status: open
    derived_from: Notion r1(2026-11-19)

  - id: D-008
    problem: 建物の認識(基準画像と位置)を、Place に含めるか、独立した概念にするか
    options:
      - 独立した概念 Landmark
      - Place に画像を持たせ、kind に「建物」を足す
    adopted: 独立した概念(案 A)
    reason: >-
      目的が「いま見ている建物がどれかを知る」で、場所を知る目的(Place)と別。基準画像という状態を持つ。
      画像の一致は状態を必要としない計算なので、外部の計算(Vision.matches)として同期に置く。
    status: open   # 実装は OQ-11、「迷い」の判定は OQ-10
    derived_from: Notion r3(2026-11-19)

  - id: D-009
    problem: スタンプを、場所(Place)に付けるか、地点(Point)に付けるか
    options:
      - 地点(Point)に付ける。押した人の現在地(足元)
      - 場所(Place)に付ける
    adopted: 地点(Point)に付ける
    reason: Slack の発言「足元にスタンプを押す」と、利用者による確認(2026-11-19)に従った。Place の削除には連動しない。
    status: resolved
    derived_from: Notion r2(2026-11-19)

  - id: D-010
    problem: 状態を読むだけのアクション(get・list・query・read など)と、system 印のアクションを、概念に持つか
    options:
      - 持たない。読み取りは同期の where、時間の経過で起きる出来事は where の判定にする
      - 前の案のまま持つ
    adopted: 持たない(案 A)
    reason: >-
      概念は getter を持たない(演繹文書 10 章)。時間の経過で起きるアクションの書き方が未確認(10 章)のため、expire は where の判定にした。
      詳細は doc/concept-design.md の 7 章。
    status: open
    derived_from: Notion r0(2026-11-17)

  - id: D-012
    problem: 絞り込み(フィルター)を、検索結果にも効かせるか
    options:
      - 効かせる
      - 一覧・地図の表示だけに効かせる
    adopted: 効かせる
    reason: 利用者(admin)の決定(2026-11-21)。PR #16 の要確認 4 への回答。concepts.yaml では、同期 search-places に「絞り込みも検索結果に効かせる(D-012)」として反映済み(D-017 の(5))。
    status: resolved
    derived_from: 'PR #16(looky-looky)の要確認 4'

  - id: D-013
    problem: 場所のカードを開いたあと、行き先を決める手順
    options:
      - カードを開いたら、そのまま行き先になる
      - カードを開き、「ここへ向かう」で行き先にする(ワンクッション)
    adopted: 「ここへ向かう」で行き先にする
    reason: '利用者の決定(2026-11-21)。Google マップのような手順。PR #16 の要確認 5。経路は直線のまま(D-003 を維持。地図の作り方は後で再検討)。'
    status: resolved
    derived_from: 'PR #16 の要確認 5・6'

  - id: D-014
    problem: 来場者の自分用タグ(Labeling)の初期値と、保存先
    options:
      - 固定の 2 つだけ
      - 固定の 2 つ + 自作を許す。保存はサーバー
      - 固定の 2 つ + 自作を許す。保存は各自の端末内
    adopted: 固定の「行きたい場所」「お気に入り」 + 自作を許す。保存は各自の端末内
    reason: >-
      利用者の決定(2026-11-21)。タグの作成、付け外し、絞り込みは端末内で完結し、API には載らない。
      端末のデータが消えるとタグも消える(同期なし)。Labeling.owner を残すか外すかは、チームが決める。
      D-007 の「Labeling に含める」は維持。名前のルール・上限数は OQ-13。
    status: resolved
    derived_from: 'PR #16 の要確認 7(お気に入り)と利用者の回答'

  - id: D-011
    problem: 事前条件が無いアクションに「なし」と書くか
    options:
      - 書く(lint.py の規則。書き忘れと区別する)
      - '書かない(演繹文書の書式に欄が無い。doc/concept-design.md の 7 章 #9)'
    adopted: concepts.yaml では「なし」と書く。doc/concept-design.md では書かない
    reason: lint.py が空の requires を ERROR とするため、YAML は規則に合わせた。食い違いは、チームで揃え方を決める。
    status: open
    derived_from: 食い違いの報告

  - id: D-015
    problem: '概念を、どう画面にまとめるか(画面設計のステップ 3、issue #6)'
    options:
      - 案 1 {Search, Labeling} | {Position, Destination, Stamp} | {Landmark}(点数 8、画面 3)
      - 案 2 {Search} | {Labeling} | {Position, Destination, Stamp} | {Landmark}(点数 7、画面 4)
    adopted: 案 1
    reason: >-
      screen_groups.py(groups.yaml、2026-11-21)の点数が最も高い。画面選定(PR #16)で理由から選んだ分け方
      (一覧・検索 / マップ / カメラ)と同じ。一緒にできなかった Landmark-Position・Landmark-Destination は、
      カメラの画面に現在地と案内バーを見せるだけ重ねて補う。
      案 2 は、絞り込みを検索結果にも効かせる(D-012)ので、Search と Labeling を分けると、絞り込みの状態が見えない画面ができるため捨てた。
      チームで合意(2026-11-21)。
    status: resolved
    derived_from: concept-design/groups.yaml、concept-design/screens.yaml、doc/screen-design/screen-selection.md

  - id: D-016
    problem: 複数の絞り込み(運営の種類と自分用のタグ)を同時に選んだとき、どう組み合わせるか
    options:
      - すべて OR(どれかが付いている。いまの同期 show-places の where)
      - 運営の種類どうしは OR、自分用のタグ(行きたい場所・お気に入り・自作)は AND で効かせる
      - お気に入りだけ AND、ほかは OR
      - すべて AND
    adopted: 運営の種類どうしは OR、自分用のタグは AND で効かせる
    reason: >-
      利用者の決定(2026-11-22。API 設計のゲート 1、台帳 API-9)。例: 飲食+展示+お気に入り → (飲食か展示)で、かつお気に入りの場所。
      「どの種類か」(運営)と「自分にとってどうか」(自分用)は軸が違うので、軸ごとに組み合わせ方を分ける。自作タグも同じ規則で説明できる。
      お気に入りだけ AND にする案は、自作タグの扱いの説明が分かれるので捨てた。すべて AND にする案は、運営の種類を複数選ぶと結果がほぼ空になるので捨てた。
      concepts.yaml の同期 show-places の where には反映済み(D-017 の(5)。運営の種類どうし OR、自分用タグ AND)。
      絞り込みは端末で行う(台帳 API-8)ので、API の仕様には影響しない。
    status: resolved
    derived_from: concept-design/api/review-ledger.yaml の API-8・API-9

  - id: D-017
    problem: API 設計(PR #21)とデザインシステム(PR #23)が一致して前提にしていて、concepts.yaml だけが違った 7 項目を、どうするか
    options:
      - 二つが一致している部分だけ concepts.yaml に反映する
      - 二つの間でもずれている項目(カメラの方式、開催時間、landmark か building か、スタンプの本人確認と期限)も、いま決める
    adopted: 一致している部分だけ反映する
    reason: >-
      利用者の指示(2026-11-22)。反映した項目: (1) Place に building・floor(API-14)、(2) Kind に設備 4 種(API-28、OQ-3)、
      (4) Request.showLabels・removeLabel・showLandmarks(API-6・7・10)、(5) 絞り込みは端末で行う。運営の種類どうし OR、自分用のタグ AND(D-012・D-014・D-016、API-8・9)、
      (6) 場所の id は開催期間中に変えない(API-31)、(7)「棟」→「建物」。
      (3) 階ごとの見取り図は、新しい概念にするかが未決なので OQ-14 に残し、概念は足していない。
      二つの間でもずれている項目は、チームの決定待ちで、反映していない。
      API-14・28 は、台帳では仮置き(利用者 sabo10p の意見。チーム未合意)。
    status: resolved
    derived_from: PR #21 の concept-design/api/review-ledger.yaml、PR #23 の design-system/props-api-check.md

  - id: D-018
    problem: 建物の判定を、映像と基準画像の照合にするか、現在地・向き・建物の輪郭にするか
    options:
      - 映像を基準画像と照合する(MindAR など。登録した地点限定)
      - 現在地・向き・建物の輪郭(OpenStreetMap)から、正面の建物を決める
    adopted: 現在地・向き・建物の輪郭から決める。Landmark.image を footprint(輪郭)に変える。画像認識は拡張として残す
    reason: >-
      利用者の決定(2026-11-22)。根拠は、PR #23 のデモ(2026-11-17 から GPS 方式)と、PR #4 の ar-guide/ の通常版(コードで確認。
      向いた方向へ線を伸ばし、最初に交わる建物を選ぶ。映像は解析しない)が一致していること。画像認識版(MindAR)は 4 地点限定の別の実験版。
      OQ-11 は、この方式で閉じた。方位の誤差の見積もり(誤差 10° でラベルが画面幅の約 3 割ずれる)は机上の仮定で、実機は未測定。
    status: resolved
    derived_from: PR #4(ar-guide/)のレビュー、PR #23 の ②

  - id: D-019
    problem: 建物の輪郭を、どこから取り、運営の画面でどこまで扱うか
    options:
      - 地図データ(OpenStreetMap)を正にする。運営は確かめて、読み込み直すだけ
      - 運営が輪郭を描く・頂点を直す
    adopted: 地図データ(OpenStreetMap)を正にする。運営の操作は、登録時の取り込みと、読み込み直し(同期 reload-footprint)だけ
    reason: >-
      利用者の決定(2026-11-22)。PR #23 の O2(BuildingShapePreview)がすでにこの形。輪郭を描く画面は作らない。
      OSM の輪郭が実際の建物とずれた建物が見つかったら、描く・直す操作を足すかを見直す(前提が崩れる条件)。
      外部の計算 Osm.outline の名前は仮。
    status: resolved
    derived_from: D-018、open-questions OQ-15

  - id: D-020
    problem: 開催時間を、説明の文字列に含めるか、別の項目として持つか。あわせて、landmark と building のどちらの名前にするか
    options:
      - description に書く(API 設計の案)
      - Place に開始と終了の時刻の組として持つ(デザインシステムの hours に合わせる)
    adopted: Place.hours として別に持つ(開始・終了の組、複数可)。名前は Landmark のまま(画面の言葉だけ「建物」)
    reason: >-
      利用者の決定(2026-11-23)。description にまとめると、将来「いまやっている企画」で絞りたいときにデータの形として難しくなる。
      名前は推奨どおり(内部は Landmark、画面は「建物」)で確定。Place の型引数 Building は Landmark の id を指す。
      API の PlaceInput・Place に hours を足す必要がある(台帳 API-14 の「時間は説明に書く」を変える)。デザインシステムの hours(文字列)は、表示用の文字列と、時刻の組の両方が要るか確かめる。
    status: resolved
    derived_from: design-system/props-api-check.md の 3、concept-design/api/review-ledger.yaml の API-14

  - id: D-021
    problem: スタンプを取り消せるのが押した本人だと、どう確かめるか
    options:
      - 押した人(by)を持ち、取り消す人と照らす
      - 押したときに取り消しの証を返し、一致で確かめる(押した人は持たない)
    adopted: 取り消しの証(proof)の一致で確かめる。Stamp.by をやめる
    reason: >-
      推奨どおり確定(利用者、2026-11-23)。API 設計の API-13・19(retractToken、by を返さない)と、デザインシステムの
      MyStampRow(端末が自分の押したスタンプを覚える)が一致する。OQ-12 のうち、本人の確かめ方は閉じた。
    status: resolved
    derived_from: API-13・API-19、OQ-12

  - id: D-022
    problem: スタンプの期限の長さ
    options:
      - 混雑は 30 分、感想はその日の閉場まで(利用者 sabo10p の案、API-17)
      - チームで測ってから決める
    adopted: 仮置きの値(混雑 30 分、感想は閉場まで)で進める
    reason: 利用者の決定(2026-11-23)。値はチームが決めるまで変えてよい。OQ-4 は開いたまま。
    status: open
    derived_from: API-17・API-25、OQ-4

  - id: D-023
    problem: 地図データ(OpenStreetMap)に輪郭が無い建物を、概念として認めるか
    options:
      - 認める(footprint を lone にする。輪郭の無い建物は、正面に出ない)
      - 認めない(輪郭が取れなければ登録できない)
    adopted: 認める(API 設計とデザインシステムに合わせる)
    reason: >-
      利用者の決定(2026-11-23)。概念設計は、今の出来上がりで一旦完成とし、問題点は残したまま、API 設計(API-37、footprint は null)と
      デザインシステム(BuildingShapePreview の「形なし」)に合わせる。concepts.yaml の Landmark.footprint を lone にし、
      register-landmark は輪郭が取れなくても登録でき、recognize-building・show-building-events は輪郭を持つ建物だけを対象にする。
      残る問題は OQ-17(輪郭の無い建物を、運営にどう知らせるか。カメラの正面に出ない建物を許してよいか)。
      注意: 元になった API 設計の API-37(footprint は null)は、台帳で確定した。合意が変われば、この決定も見直す。
    status: resolved
    derived_from: API-37、design-system/components/BuildingShapePreview

  - id: D-024
    problem: 建物の企画を、建物の「近く」(距離)で決めるか、場所の建物との結びつき(building)で決めるか
    options:
      - 距離で決める(near の範囲は OQ-10 で未決のまま)
      - 場所の building が、その建物と一致するもので決める
    adopted: 場所の building が一致するもので決める(API 設計の API-23 を優先)
    reason: >-
      利用者の決定(2026-11-23)。デザインシステム(PR #23)は、この範囲を決めておらず「近いとみなす範囲は OQ-10」と書くだけで、
      端末へ返す形(landmarks/{id}/places)だけを示している。API 設計(API-23)は「landmarkId がその建物の場所を返す」と決めている。
      Place に building が入った(D-017)ので、距離の範囲を決める必要が無くなる。概念の同期 show-building-events・show-no-events の
      where を、距離から Place.building の一致に直した。doc/concept-design.md の同期は、すでにこの形だった。OQ-10 のうち near は閉じ、
      「迷っている」の判定だけが残る。屋外の企画(building なし)は、建物の企画には出ない。
      注意: 元になった API 設計の API-23(landmarkId で返す)は、台帳で確定した。合意が変われば、この決定も見直す。
    status: resolved
    derived_from: API-23、OQ-10、D-017

  - id: D-025
    problem: カメラの企画の札の「方向・距離・建物の奥か」の計算を、概念に入れるか、端末の計算にするか
    options:
      - 端末の計算とし、概念に入れない
      - 概念の同期の where に外部の計算として入れる
    adopted: 端末の計算とし、概念には入れない(API 設計に記述が無いため、端末に割り切る)
    reason: >-
      利用者の決定(2026-11-23)。API 設計(PR #21)は、正面の建物の判定(recognizeBuilding)と、行き先への直線の方角・距離(showRoute。D-003)を
      端末内の計算としている(x-excluded-requests)。企画の札の方向・距離・「建物の奥か」は、API 設計に記述が無く、
      デザインシステム(BuildingCameraOverlay)が画面の部品として扱っている。現在地と向きは端末の外へ送らない(D-018)ので、
      同じ入力(現在地・向き・輪郭・場所の位置)で端末が計算できる。サーバーが返すのは、建物の企画の一覧(D-024)と輪郭だけ。
      概念は変えない(状態も変えない読み取りの計算で、概念にする理由が無い)。
    status: resolved
    derived_from: API-5・D-003・D-018、design-system/components/BuildingCameraOverlay

  - id: D-026
    problem: 来場者が案内をやめる操作を、概念にどう書くか(着く前の「案内をやめる」と、着いた後の「案内を終える」)
    options:
      - 同じ操作として、同期 clear-destination を 1 本足す
      - 「やめる」と「終える」を、別の操作・別の同期にする
    adopted: 同期を 1 本足す。言葉の違いは画面の側に残す
    reason: >-
      利用者の決定(2026-11-23)。デザインシステム(PR #23。glossary.md)は、2 つを同じ操作(Destination.clear)とし、来場者の気持ちの違いだけで
      画面の言葉を分けている。概念には、来場者が Destination.clear を呼ぶ同期が無く、場所の削除からの連動(remove-clears-destination)しか無かった。
      Request.clearDestination を受けて Destination.clear を呼ぶ同期を足した。API 設計では、行き先の操作は端末内(API-5)で、API には載せない。
      着いたとみなす距離(20 m の仮置き)は、端末が距離から判定する(概念には入れない)。
    status: resolved
    derived_from: design-system/glossary.md、wireframe.md の「※ 案内をやめる」、API-5

  - id: D-027
    problem: 設備(案内所・トイレ・休憩所・ゴミ箱)を、検索に出すか
    options:
      - 検索に出さない。地図の「表示する印」(V1-h)のチェックで探す
      - タグ・種類の絞り込みで探す
    adopted: 検索に出さず、「表示する印」で探す(デザインシステムの方針)
    reason: >-
      利用者の決定(2026-11-23)。デザインシステム(PR #23。glossary.md、wireframe.md、screen-selection.md)は、設備を検索・絞り込みの対象にせず、
      画面 V1-h「表示する印」のチェック(端末の中に保存)で、地図に出す印を選ぶ形にしている。API 設計(API-28)も、絞らない案で API は変わらない。
      概念の注記は「設備は検索・絞り込みの対象にしない」だったが、同期 index-on-register が設備も検索の索引に入れていたため、
      index-on-register と reindex-on-update の where に「設備でない」を足した。API の GET /places/search は、この索引から探すので、API の仕様は変わらない。
      未処理: 場所の種別を、後から設備に変えたとき、すでにある索引の項目は消えない(必要になったら、別の同期で扱う)。
    status: resolved
    derived_from: design-system/glossary.md、wireframe.md V1-h、API-28、OQ-3

  - id: D-028
    problem: 運営が場所に付けた種類を外す操作を、概念に書くか
    options:
      - 同期 unassign-label を足す(Request.unassignLabel → Labeling.detach)
      - 書かない(API だけが持つ)
    adopted: 同期を足す(API 設計の API-41 に合わせる)
    reason: >-
      利用者の指示(2026-11-23)で、概念設計は API 設計とデザインシステムに合わせて直す。API 設計(PR #21)は、付け間違いを取り消すため、
      DELETE /places/{placeId}/labels/{labelId} を足した(API-41。仮置き)。概念には、運営が種類を付ける同期(assign-label)だけがあり、
      外す同期が無かった(unmark-place は来場者の自分用タグで、別物)。Labeling.detach は既にあるので、同期 unassign-label を足した。
      違い: 概念の detach は「付いていること」が事前条件で、API は付いていなくても 204(冪等)。API の層が、事前条件を満たさない場合も成功として返す。
      注意: API-41 は、チームの合意待ちの仮置き。合意が変われば、この決定も見直す。
    status: resolved
    derived_from: API-41、Labeling.detach

  - id: D-029
    problem: 階ごとの見取り図(図形と、四隅の緯度経度)を、概念にするか
    options:
      - 新しい概念にする(案 A)
      - Landmark に持たせる(案 B)
      - 概念に入れず、API と画面だけで扱う(案 C)
    adopted: 案 C(概念に入れない)
    reason: >-
      利用者の決定(2026-11-23)。見取り図に付いているのは、階ごとの図形と四隅の緯度経度の状態と、運営の登録・差し替え・削除だけで、
      他の概念の状態に影響する規則も、守る条件も無い。来場者は見るだけ。独立した概念にするほどの中身が無いので、概念に入れない。
      案 B は、Landmark の目的(いま見ている建物がどれかを知る)に、別の目的(建物の中の位置を知る)が混ざるので取らなかった。
      地図は表現で概念にしない(D-004)ことにも合う。
      残る点: 見取り図の登録・削除の操作(API の PUT・DELETE /landmarks/{landmarkId}/floors/{floor}/plan)は、概念の要求に対応しない。
      openapi_check の WARN(x-request が無い)は、API 側が「概念の要求ではない」と説明に書けば足りる。
      建物を削除したときに見取り図も消すかは、概念の規則ではなく、API 側の実装と台帳の扱いに残る。API 側で、一緒に消すと決めた(2026-11-23、台帳 API-29)。
      前提(崩れたら見直す条件): 見取り図に独自の規則(例: 階ごとの混雑)を足す予定が出たとき。
    status: resolved
    derived_from: OQ-14、API-29・30、D-004


  - id: D-030
    problem: 設備(案内所・トイレ・休憩所・ゴミ箱)を、建物の企画の一覧(show-building-events)に含めるか
    options:
      - 含める(建物にある場所は全部出す)
      - 含めない(設備は地図の「表示する印」でだけ使う)
    adopted: 含めない
    reason: >-
      利用者の決定(2026-11-23)。D-027 で、設備は検索に出さず、地図の「表示する印」(V1-h)でだけ使うと決めた。
      建物の企画の一覧は「その建物で何をやっているか」を知るためのもので、トイレやゴミ箱が並ぶと目的から外れる。
      show-building-events・show-no-events の where に「Place.kind of p が設備でない」を足した。設備だけが登録された建物は、
      「企画が無い」扱いになる(意図どおり)。API 側は、API 設計の担当が、この確認を待って書く。
    status: resolved
    derived_from: D-027、D-024、API-23

  - id: D-031
    problem: Place.update で、種別(kind)を変えられるか
    options:
      - 変えられる(概念のまま)
      - 変えられない(API に合わせる。変えるときは削除して登録し直す)
    adopted: 変えられない(API 設計に合わせる)
    reason: >-
      利用者の決定(2026-11-23)。API 設計の担当が、PATCH から kind を外した(台帳 API-28)。概念が kind を変えられる形のままだと、
      実装者が「概念では変えられるのに API では変えられない」と迷う。Place.update は kind を受け取らず、kind を除く属性を更新する。
      登録時の取り違えは、運営が削除して登録し直す。場所の id は再利用しないので、スタンプなどが付いた場所では手間が増える。
      前提(崩れたら見直す条件): 登録後に種別を直したい要望が多いとき。
    status: resolved
    derived_from: API-28、D-027

  - id: D-032
    problem: 運営が場所に種類を付ける操作(Labeling.attach・detach)を、画面の操作の数にどう数えるか(op_places は上限 4 に達している)
    options:
      - 場所の登録・更新の一部として数え、上限 4 のままにする
      - 上限を 5 に上げる
      - Labeling.define を別の画面(種類の管理)に移す
    adopted: 場所の登録・更新の一部として数える(上限 4 のまま)
    reason: >-
      利用者の決定(2026-11-23。デザインシステムの O1 を分けない判断と合わせて)。種類の付け外しは、場所の入力欄の中の「種類を選ぶ」欄で行い、
      実際の操作の流れは 1 つのまま。上限の値も画面の数も変えない。デザインシステムは、この欄を CheckRow の再利用で作る(#23)。
      screens.yaml では、op_places の register・update の注記に書き、actions には並べない(並べると 6 個で上限を超える)。
      API は PUT・DELETE /places/{id}/labels/{labelId}。付ける・外すは冪等(API-41)。
      前提(崩れたら見直す条件): 種類の付け外しを、場所の登録・更新と別の操作として見せたくなったとき。
    status: resolved
    derived_from: D-028、API-6・7、デザインシステムの O1
