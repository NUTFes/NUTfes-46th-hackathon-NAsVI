# 設計上の課題の記録(問題 → 選択肢 → 採用案と理由)。写像の分割・統合の判断をここに残す。
# 別案を捨てたときも理由を残す。後の写像から差し戻されたときに、同じ手順でやり直せるようにするため。
decisions:
  - id: D-001
    problem: 種類で選ぶ振る舞い(Labeling)を、独立した概念にするか、Place の属性に畳むか
    options:
      - 独立した概念 Labeling [Item, Label]
      - Place に category 属性を持たせる
    adopted: 独立した概念(案 A)
    reason: >-
      目的が「種類で絞って選べる」で、場所を知る目的(Place)と別。混ぜると混同になる(分離)。
      また F4 が optional なので、独立させておけば F4 を外すときに概念ごと外せる(I5)。
    status: open   # OQ-3 の結果で、F4 ごと外れる可能性がある
    derived_from: 6.1040 L04(分離・特定性)

  - id: D-002
    problem: キーワード検索を、Place の振る舞いに含めるか、独立した概念にするか
    options:
      - 独立した概念 Search [Item]
      - Place.query として Place に含める
    adopted: 独立した概念(案 A)
    reason: >-
      目的が「名前の一部から見つける」で、場所を知る目的と別。含めると Place が過負荷になる。
      Search は Item の型を問わないので、汎用性もある。連動は同期(register-indexes)に出した。
    status: open
    derived_from: 6.1040 L04(特定性・汎用性)

  - id: D-003
    problem: 現在地から行き先への経路(P1 は直線)を、概念にするか
    options:
      - 概念にする(Route)
      - 概念にしない。Position と Destination の値から画面が計算する
    adopted: 概念にしない(案 A)
    reason: >-
      直線は状態を持たない計算で、保つべき状態も、アクションの事前条件も無い。
      道なりの経路など、経路を保つ・選ぶ振る舞いが出てきたら Route を立てる。
    status: open
    derived_from: 6.1040 L02(状態の無いものは概念にならない)。資料内の明示は無く、資料外の判断

  - id: D-004
    problem: 地図表示を概念にするか
    options:
      - 概念にする(Map)
      - 概念にしない
    adopted: 概念にしない
    reason: 地図は表現(UI)で、Place・Position・Congestion の状態を重ねて描く。表現に依存しない(定義 4 章)。
    status: resolved
    derived_from: 定義 4 章「UI に依存しない」

  - id: D-005
    problem: 道案内(行き先への方角と距離)を、概念に含めるか、画面が毎回計算するか
    options:
      - Destination に道案内の状態(heading・remaining・guidedAt)を含める
      - 含めず、画面が現在地と行き先から毎回計算する
    adopted: Destination に含める(案 A)
    reason: >-
      Slack のコメント「道案内までこの概念に含めていいのでは」に従った。目的が「向かう先を決めて、そこへ向かう」で同じ。
      計算は状態を必要としないので同期が行い、結果を Destination が保つ。現在地を Destination の中で参照すると独立性を崩すため、現在地は同期が渡す。
      道なりの経路を扱う場合は、経路の状態を Destination に足すか別の概念にする(D-003 の続き)。
    status: open   # チームの合意前
    derived_from: Notion r1(2026-11-19)

  - id: D-006
    problem: 混雑の報告(Congestion)を、スタンプに差し替えるか
    options:
      - 差し替える。足元に押すスタンプ Stamp(混雑 1〜5、面白い、美味しい、よさ など)にする
      - 混雑の報告を残し、感想のスタンプを別の概念として足す
    adopted: 差し替える(案 A)
    reason: >-
      Slack の発言「足元にスタンプを押す。混雑状況 1〜5、面白い、美味しい、よさ」に従った。混雑も感想も「足元に押して共有する」で目的が同じ。
      報告者の権限(OQ-1)は不要になり、スタンプは来場者が押す。
    status: open   # スタンプの種類と期限は OQ-4
    derived_from: Notion r1(2026-11-19)

  - id: D-007
    problem: 来場者の自分用タグ(お気に入り、行きたい)と絞り込みステータスを、Labeling に含めるか、別の概念にするか
    options:
      - Labeling [User, Item] に含める(owner を持つ Label が自分用タグ)
      - 運営の種類は Labeling、自分用タグは別の概念(Bookmark など)にする
    adopted: Labeling に含める(案 A)
    reason: >-
      目的が同じ(項目をタグで絞って選ぶ)。Slack のコメントも Labeling への追記だった。絞り込みステータス(filtering)も、同じ概念で保つ。
      運営の種類と自分用タグを分ける案は、確認できていない点として doc/concept-design.md の 8 章に残した。
    status: open
    derived_from: Notion r1(2026-11-19)

  - id: D-008
    problem: 建物の認識(基準画像と位置)を、Place に含めるか、独立した概念にするか
    options:
      - 独立した概念 Landmark
      - Place に画像を持たせ、kind に「建物」を足す
    adopted: 独立した概念(案 A)
    reason: >-
      目的が「いま見ている建物がどれかを知る」で、場所を知る目的(Place)と別。基準画像という状態を持つ。
      画像の一致は状態を必要としない計算なので、外部の計算(Vision.matches)として同期に置く。
    status: open   # 実装は OQ-11、「迷い」の判定は OQ-10
    derived_from: Notion r3(2026-11-19)

  - id: D-009
    problem: スタンプを、場所(Place)に付けるか、地点(Point)に付けるか
    options:
      - 地点(Point)に付ける。押した人の現在地(足元)
      - 場所(Place)に付ける
    adopted: 地点(Point)に付ける
    reason: Slack の発言「足元にスタンプを押す」と、利用者による確認(2026-11-19)に従った。Place の削除には連動しない。
    status: resolved
    derived_from: Notion r2(2026-11-19)

  - id: D-010
    problem: 状態を読むだけのアクション(get・list・query・read など)と、system 印のアクションを、概念に持つか
    options:
      - 持たない。読み取りは同期の where、時間の経過で起きる出来事は where の判定にする
      - 前の案のまま持つ
    adopted: 持たない(案 A)
    reason: >-
      概念は getter を持たない(演繹文書 10 章)。時間の経過で起きるアクションの書き方が未確認(10 章)のため、expire は where の判定にした。
      詳細は doc/concept-design.md の 7 章。
    status: open
    derived_from: Notion r0(2026-11-17)

  - id: D-012
    problem: 絞り込み(フィルター)を、検索結果にも効かせるか
    options:
      - 効かせる
      - 一覧・地図の表示だけに効かせる
    adopted: 効かせる
    reason: 利用者(admin)の決定(2026-11-21)。PR #16 の要確認 4 への回答。concepts.yaml の search-places の where は未反映(チームで反映を決める)。
    status: resolved
    derived_from: PR #16(looky-looky)の要確認 4

  - id: D-013
    problem: 場所のカードを開いたあと、行き先を決める手順
    options:
      - カードを開いたら、そのまま行き先になる
      - カードを開き、「ここへ向かう」で行き先にする(ワンクッション)
    adopted: 「ここへ向かう」で行き先にする
    reason: 利用者の決定(2026-11-21)。Google マップのような手順。PR #16 の要確認 5。経路は直線のまま(D-003 を維持。地図の作り方は後で再検討)。
    status: resolved
    derived_from: PR #16 の要確認 5・6

  - id: D-014
    problem: 来場者の自分用タグ(Labeling)の初期値と、保存先
    options:
      - 固定の 2 つだけ
      - 固定の 2 つ + 自作を許す。保存はサーバー
      - 固定の 2 つ + 自作を許す。保存は各自の端末内
    adopted: 固定の「行きたい場所」「お気に入り」 + 自作を許す。保存は各自の端末内
    reason: >-
      利用者の決定(2026-11-21)。タグの作成、付け外し、絞り込みは端末内で完結し、API には載らない。
      端末のデータが消えるとタグも消える(同期なし)。Labeling.owner を残すか外すかは、チームが決める。
      D-007 の「Labeling に含める」は維持。名前のルール・上限数は OQ-13。
    status: resolved
    derived_from: PR #16 の要確認 7(お気に入り)と利用者の回答

  - id: D-011
    problem: 事前条件が無いアクションに「なし」と書くか
    options:
      - 書く(lint.py の規則。書き忘れと区別する)
      - 書かない(演繹文書の書式に欄が無い。doc/concept-design.md の 7 章 #9)
    adopted: concepts.yaml では「なし」と書く。doc/concept-design.md では書かない
    reason: lint.py が空の requires を ERROR とするため、YAML は規則に合わせた。食い違いは、チームで揃え方を決める。
    status: open
    derived_from: 食い違いの報告

  - id: D-015
    problem: 概念を、どう画面にまとめるか(画面設計のステップ 3、issue #6)
    options:
      - 案 1 {Search, Labeling} | {Position, Destination, Stamp} | {Landmark}(点数 8、画面 3)
      - 案 2 {Search} | {Labeling} | {Position, Destination, Stamp} | {Landmark}(点数 7、画面 4)
    adopted: 案 1
    reason: >-
      screen_groups.py(groups.yaml、2026-11-21)の点数が最も高い。画面選定(PR #16)で理由から選んだ分け方
      (一覧・検索 / マップ / カメラ)と同じ。一緒にできなかった Landmark-Position・Landmark-Destination は、
      カメラの画面に現在地と案内バーを見せるだけ重ねて補う。
      案 2 は、絞り込みを検索結果にも効かせる(D-012)ので、Search と Labeling を分けると、絞り込みの状態が見えない画面ができるため捨てた。
      チームで合意(2026-11-21)。
    status: resolved
    derived_from: concept-design/groups.yaml、concept-design/screens.yaml、doc/screen-design/screen-selection.md
