<!-- 見本(Claude Design のカードの印) @dsCard group="地図の印" height=168 -->
<!doctype html>
<html lang="ja">
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script>document.documentElement.setAttribute('data-theme', new URLSearchParams(location.search).get('theme') || 'dark');</script>
<script src="../lib/react.production.min.js"></script>
<script src="../lib/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<meta charset="utf-8"><title>StampMark — 見本</title></head>
<body>
<div id="root"></div>
<script>
  var N = window.NAsVI, h = React.createElement;
  function L(t) { return h('p', { className: 'nv-pv-label' }, t); }
  function S(v) { return React.useState(v); }
  function ago(m) { return Date.now() - m * 60000; }
  function SCENE() {
    return h('svg', { className: 'nv-cam-scene', viewBox: '0 0 300 420', preserveAspectRatio: 'xMidYMid slice', 'aria-hidden': 'true' },
      h('rect', { width: 300, height: 420, fill: 'var(--ink-800)' }), h('rect', { y: 300, width: 300, height: 120, fill: 'var(--ink-700)' }),
      h('rect', { x: 50, y: 130, width: 200, height: 170, fill: 'var(--mist-600)', opacity: 0.6 }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'nv-pv',style:{alignItems:'center',gap:20}},
  L('縮小のとき(混雑は濃淡、感想はマーク。重なりは「+N」)'),
  [1,2,3,4,5].map(function(n){return h(N.StampMark,{key:n,kind:'congestion-'+n,pressedAt:ago(n*2)});}),
  h(N.StampMark,{kind:'congestion-4',pressedAt:ago(6),more:5}),
  ['fun','food','good'].map(function(k){return h(N.StampMark,{key:k,kind:k,pressedAt:ago(14)});}),
  L('拡大のとき(種類と経過時間)'),
  h(N.StampMark,{kind:'congestion-4',pressedAt:ago(6),more:5,zoomed:true}),
  h(N.StampMark,{kind:'congestion-1',pressedAt:ago(9),zoomed:true}),
  h(N.StampMark,{kind:'fun',pressedAt:ago(22),zoomed:true})));
</script>
</body>
</html>
