name: deploy

# 試験(preview)と本番(production)へ、Worker・D1 のマイグレーション・Web(Pages)をデプロイする。
# - 手動(workflow_dispatch): 環境を選んで実行する。本番はこちらだけ。
# - impl/main への push: 試験だけ。リポジトリの変数 AUTO_DEPLOY_PREVIEW が 'true' のときだけ動く(既定は止まっている)。
# 実値(D1 の ID・Access の AUD など)はリポジトリに置かず、GitHub の Environments の変数・Secrets から受け取る。
# 必要な値の一覧は doc/deploy.md の「GitHub Actions での自動デプロイ」を見る。

on:
  workflow_dispatch:
    inputs:
      environment:
        description: デプロイ先の環境
        type: choice
        options: [preview, production]
        default: preview
  push:
    branches: [impl/main]

permissions:
  contents: read

env:
  COREPACK_ENABLE_NETWORK: '0'
  WRANGLER_SEND_METRICS: 'false'
  CI: 'true'

jobs:
  deploy:
    # push は、AUTO_DEPLOY_PREVIEW が 'true' のときだけ。
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_PREVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: 検査(型・テスト)
        run: |
          pnpm -r typecheck
          pnpm --filter api test
          pnpm --filter web test

      - name: Web をビルド
        run: pnpm --filter web build

      - name: 実値入りの設定を組み立てる(コミットしない。api/.wrangler は無視対象)
        shell: bash
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          OSM_CONTACT: ${{ vars.OSM_CONTACT }}
          SITE_HOST: ${{ vars.SITE_HOST }}
          ZONE_NAME: ${{ vars.ZONE_NAME }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required = [
              'D1_DATABASE_ID', 'ACCESS_TEAM_DOMAIN',
              'ACCESS_AUD', 'OSM_CONTACT', 'SITE_HOST', 'ZONE_NAME', 'PAGES_PROJECT',
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('未設定の値があります: ' + ', '.join(missing))

          target = os.environ['TARGET']
          assert target in ('preview', 'production')
          # Wrangler は binding / vars を表示するため、後続の全ステップで伏せる。
          for key in ('D1_DATABASE_ID', 'ACCESS_AUD', 'OSM_CONTACT'):
              value = os.environ[key].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::add-mask::{value}')
          config = json.loads(Path('api/wrangler.jsonc').read_text())
          env = config['env'][target]
          env['vars']['ACCESS_TEAM_DOMAIN'] = os.environ['ACCESS_TEAM_DOMAIN']
          env['vars']['ACCESS_AUD'] = os.environ['ACCESS_AUD']
          env['vars']['OSM_CONTACT'] = os.environ['OSM_CONTACT']
          # 公開環境では開発用の入口を閉じる(doc/deploy.md)。
          assert env['vars']['ENABLE_DEV_EMIT'] == 'false'
          assert 'ACCESS_BYPASS' not in env['vars']
          env['d1_databases'][0]['database_id'] = os.environ['D1_DATABASE_ID']
          # 設定ファイルは api/.wrangler/deploy/ に置くので、パスはそこからの相対にする。
          env['d1_databases'][0]['migrations_dir'] = '../../migrations'
          env['main'] = '../../src/index.ts'
          env['routes'] = [{'pattern': f"{os.environ['SITE_HOST']}/api/*", 'zone_name': os.environ['ZONE_NAME']}]
          config['main'] = '../../src/index.ts'
          out = Path('api/.wrangler/deploy/wrangler.jsonc')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(config, indent=2, ensure_ascii=False))
          print(f'設定を組み立てました: {target}(実値は表示しません)')
          PY

      - name: 本番 D1 の復旧点を記録(UTC)
        if: env.TARGET == 'production'
        run: date -u '+D1 Time Travel recovery timestamp UTC = %Y-%m-%dT%H:%M:%SZ'

      - name: D1 のマイグレーションを適用
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: api
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Cloudflare の資格情報が未設定です'; exit 1; }
          pnpm exec wrangler d1 migrations list DB --env "$TARGET" --remote --config ./.wrangler/deploy/wrangler.jsonc
          pnpm exec wrangler d1 migrations apply DB --env "$TARGET" --remote --config ./.wrangler/deploy/wrangler.jsonc
          pnpm exec wrangler d1 migrations list DB --env "$TARGET" --remote --config ./.wrangler/deploy/wrangler.jsonc

      - name: Worker をデプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: api
        run: pnpm exec wrangler deploy --env "$TARGET" --config ./.wrangler/deploy/wrangler.jsonc

      - name: Web(Pages)をデプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
        working-directory: api
        run: pnpm exec wrangler pages deploy ../web/dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA"

      - name: 動作確認
        env:
          SITE_HOST: ${{ vars.SITE_HOST }}
        shell: bash
        run: |
          set -e
          # Pages の反映と証明書の発行に少しかかることがある。
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$SITE_HOST/api/places" || true)
            [ "$code" = 200 ] && break
            sleep 10
          done
          echo "GET /api/places: $code"
          [ "$code" = 200 ]
          # 認証なしの書き込みは通らないこと
          code=$(curl -s -X POST -H 'content-type: application/json' -d '{}' -o /dev/null -w '%{http_code}' "https://$SITE_HOST/api/places")
          echo "POST /api/places(認証なし): $code"
          [ "$code" = 401 ]
          # Access の転送先は追わず、想定と違えば止める。
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$SITE_HOST/admin/")
          echo "GET /admin/(認証なし): $code"
          [ "$code" = 302 ]
